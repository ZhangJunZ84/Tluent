name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.0.2). If omitted, falls back to github.ref_name'
        required: false
        type: string
  release:
    types: [ published, prereleased ]
    
permissions:
  contents: write
  packages: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
    - name: GitHub Checkout
      uses: actions/checkout@v4

    - name: Setup PNPM
      uses: pnpm/action-setup@v4
      with:
        version: 9
        run_install: true
    
    - name: Setup Aftman
      uses: ok-nick/setup-aftman@v0.3.0
    
    - name: Install Rojo, Lune and DarkLua
      run: aftman install
        
    - name: Build and Compile
      run: |
        pnpm run rojo --verbose
      
    - name: Bundle Luau
      run: pnpm run bundle
      
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}
        files: |
          dist/main.rbxm
          dist/main.lua